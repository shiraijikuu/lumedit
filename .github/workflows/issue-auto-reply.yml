name: Issue Auto Reply / Issue 自动回复

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '感谢反馈。我会尽快查看。如果信息不完整，可能会打上 `needs-info` 标签，方便你补充。\n\nThank you for your report. I will review it as soon as possible. If information is missing, I may add the `needs-info` label so you can add the details.'
            });