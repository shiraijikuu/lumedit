appId: com.lumedit.desktop
productName: LumEdit
copyright: Copyright © 2026 LumEdit
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - "!dist-electron/main.es.mjs"
  - package.json
# 只保留中英两套 Chromium 语言包（其余约 38MB 裁掉）；应用自身界面语言由内置 i18n 提供
electronLanguages:
  - zh-CN
  - en-US
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: LumEdit 光影轻修
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: LumEdit-${version}-setup.${ext}
  # 安装目录安全加固：强制独立 LumEdit 子文件夹 + 卸载防误删
  include: build/installer.nsh
portable:
  artifactName: LumEdit-${version}-portable.${ext}
asar: true
# electron-updater 依赖发布时生成的 latest.yml；仓库创建后执行 `npm run dist:full` 即会产出，
# 随后把 release/ 下安装包与 latest.yml 一并上传到 GitHub Release。
publish:
  - provider: github
    owner: shiraijikuu
    repo: lumedit
    releaseType: release
