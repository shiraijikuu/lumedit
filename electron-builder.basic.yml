# 基础版（仅第一档调色）：独立 appId / 产品名 / 输出目录，可与完整版共存
appId: com.lumedit.desktop.basic
productName: LumEdit Basic
copyright: Copyright © 2026 LumEdit
directories:
  output: release-basic
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
electronLanguages:
  - zh-CN
  - en-US
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: LumEdit-Basic-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: LumEdit 基础版
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
asar: true
# 基础版不接入 electron-updater（避免与完整版共用 latest.yml 冲突）
publish: []
